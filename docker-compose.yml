# Utopp Metrics. Usa el Postgres que publica Utopp Plataforma en utopp_default.
services:
  backend:
    build: ./Backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      METRICS_JWT_SECRET: ${METRICS_JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "${BACKEND_PORT:-8002}:8002"
    volumes:
      - ./Backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    networks:
      - utopp_default

  frontend:
    image: node:22-alpine
    working_dir: /app
    env_file: .env
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${FRONTEND_PORT:-5175}:5175"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5175"
    networks:
      - utopp_default

networks:
  utopp_default:
    name: utopp_default
    external: true
